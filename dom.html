<!DOCTYPE html>

<html>
<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>Ejercicio DOM básico</title>

</head>

 

<body>

    <p>

        Prueba A

        <a href="http://prueba">enlace A</a>

        Prueba B

        <a href="http://prueba2">enlace B</a>

        Prueba C

    </p>

 

    <p>

        Prueba D

        <a href="http://prueba">enlace C</a>

        Prueba E

        <a href="http://prueba3">enlace D</a>

        Prueba F

    </p>

 

    <p>

        Prueba G

        <a href="http://prueba">enlace G</a>

        Prueba H

        <a href="http://prueba4">enlace H</a>

        Prueba I

        <a href="http://prueba5">enlace I</a>

        Prueba J.

    </p>


<script defer>
        //A) Numero de Enlaces en la pagina
        let nEnlaces = document.getElementsByTagName("a").length;
        console.log("A) Numero de enlaces: " + nEnlaces);

        //B) Direccción del penultimo enlace
        let arrayEnlaces = document.getElementsByTagName("a");
        let penultimo = arrayEnlaces[arrayEnlaces.length -2].href;
        console.log("B) Contenido del penultimo enlace: " + penultimo);
    
        //C) Numero de enlaces a http://prueba
        let enlacesPrueba = 0;
        for(let i = 0; i<arrayEnlaces.length; i++){
            if(arrayEnlaces[i].href === "http://prueba/"){
                enlacesPrueba++;
            }
        }
        console.log("C) El numero de enlaces que apuntan a 'http://prueba' son: " + enlacesPrueba);


        //D) Numero de enlaces del 3er párrafo
        let parrafos= document.getElementsByTagName("p");
        let nodosTercerParrafo= parrafos[2].childNodes;
        let enlacesTercerParrafo = 0;
        for(let i=0; i<nodosTercerParrafo.length; i++){
            if(nodosTercerParrafo[i].nodeName== "A"){
                enlacesTercerParrafo++;
            }
            
        }
        console.log("D) Numero de enlaces en el 3er párrafo: " + enlacesTercerParrafo);


    </script>

  

</body>

</html>
