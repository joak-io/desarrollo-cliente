<!DOCTYPE html>
<html>
<head>
    <title>Eliminar elementos</title>

    <script>

//Cando se haga click en el boton, el ultimo item se elimina
// En caso de que no haya ninguno, no se debe producir ningun error
        function eliminar() {
            let lista = document.getElementById("lista");
            let ultimo = lista.lastElementChild;
            if(ultimo!=null){
                ultimo.parentNode.removeChild(ultimo);
            }
        }

    </script>
</head>

<body>

    <ul id="lista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
        <li>Elemento 4</li>
        <li>Elemento 5</li>
    </ul>

    <button onclick="eliminar()">Eliminar último</button>

</body>
</html>
