<!DOCTYPE html>
<html>

<head>

<title>Ejericio 5</title>

<meta charset="UTF-8">

 

<script type="text/javascript">

  function enviar() {
//si la respuesta es incorrecta indique "No es correcto" e inicialice
//la caja con el texto 'prueba otra vez'
    const PRESIDENTE = "Pedro Sanchez";
    const TEXTBOX = "Prueba otra vez";

    let respuesta = document.getElementById("respuesta");
    let parrafo = document.getElementById("resultado");

    if(respuesta.value != PRESIDENTE){
        parrafo.textContent = "Respuesta Incorrecta";
        respuesta.value = "Prueba otra vez";
    }
    else {
        parrafo.textContent = "Respuesta Correcta";
    }
  }

</script>

 

</head>

<body>

  <h4> Pregunta </h4>

  <p> ¿Quién es el presidente de España? </p>

  <input type="text" id="respuesta" value="responda aquí">

  <button type="button" onclick="enviar()">enviar</button>

  <div>
    <p id="resultado"></p>
  </div>

</body>

</html>
