<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="ej5.js"></script>
</head>
<body>
    <h1>Formulario Registro</h1>

    <form action="#" method="post" id="formRegistro">
        <label>Nombre:</label>
            <input type="nombre" id="nombre">

        <br><br>
        <label>Edad</label>
            <input type="number" id="edad">
 
        <br><br>
        <label>Curso</label>
            <select id="curso">
                <option value="daw">DAW</option>
                <option value="dam">DAM</option>
                <option value="asir">ASIR</option>
            </select>
        
        
        <br><br>
        <label>Beca?</label>
            <input type="checkbox" id="beca">

        <br><br>
        <label>Lista de Alumnos</label>
        <ul id="listaAlumnos">
        </ul>
        
        <br><br>
        <button type="submit" id="btnEnviar">Enviar</button>
    </form>

    <button type="button" id="btnBorrarUltimo">Borrar ultimo</button>


</body>
</html>
