<!DOCTYPE html>
<html>

<head>

<title>Ejercicio DOM</title>

<script type="text/javascript">

//Cada vez que se pulse el boton se añadan nuevos elementos 
// en la lista

function insertar() {
    let numElemento = document.getElementsByTagName("li").length + 1;

        let elemento = document.createElement("li");
        let contenido = document.createTextNode("Elemento " + numElemento);
        elemento.appendChild(contenido);
        document.getElementById("lista").appendChild(elemento);
}

</script>

</head>

 

<body>

<ul id="lista">

      <li>Elemento 1</li>

      <li>Elemento 2</li>

      <li>Elemento 3</li>

      <li>Elemento 4</li>

</ul>

<input type="button" value="Insertar elemento" onclick="insertar();">

</body>

</html>
